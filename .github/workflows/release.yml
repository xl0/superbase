name: Release

# `scripts/release.ts` pushes the tag; that push is the only trigger. Tags with
# a prerelease suffix (v1.2.3-rc.1) are ignored.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency: release

jobs:
  publish-npm:
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - run: npm install --global npm@12.0.2
      - run: bun install --frozen-lockfile

      - name: Verify release tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"

      # Typecheck, tests (database tests skip without TEST_DATABASE_URL) and the
      # production launcher test, which also builds the package contents.
      - run: bun run verify

      # Skipping an already-published version is what lets a half-failed release
      # be re-run. A registry error still fails: only a 404 means "not there".
      # Staged-but-unapproved versions are invisible to `npm view`; re-running
      # then fails on the stage publish itself (versions share one index).
      - name: Stage on npm
        run: |
          set -euo pipefail

          pkg="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if seen="$(npm view "${pkg}@${version}" version 2>&1)"; then
            echo "${pkg}@${version} is already published (${seen}); skipping."
            exit 0
          fi
          case "$seen" in
            *E404*|*"404 Not Found"*) ;;
            *) echo "::error::could not query npm for ${version}: ${seen}"; exit 1 ;;
          esac

          # Staged, not published: CI builds with OIDC provenance, but the
          # version only reaches the registry after a maintainer approves it
          # with 2FA (`npm stage approve` or npmjs.com).
          npm stage publish --access public --provenance --ignore-scripts

  # Images go out with the verified npm build. Docker Hub needs the repository
  # variable DOCKERHUB_USERNAME and secret DOCKERHUB_TOKEN.
  docker:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/superbase
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/superbase
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Gated on publish-npm, so a release is only ever visible for a version
      # whose verified build was at least staged on npm. Installability still
      # waits on the manual 2FA approval.
      - name: Create the GitHub Release
        run: |
          set -euo pipefail

          awk -v want="## [${GITHUB_REF_NAME#v}]" '
            index($0, want) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > NOTES.md

          # awk prints the blank line after the heading too, so `test -s`
          # would pass an empty section.
          grep -q '[^[:space:]]' NOTES.md || { echo "::error::no CHANGELOG.md section for $GITHUB_REF_NAME"; exit 1; }

          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file NOTES.md
